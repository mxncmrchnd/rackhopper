<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rackhopper</title>
  <script>
    // Apply a saved theme before anything is drawn, so a reload doesn't flash
    // the other theme first. (The rest of the app loads later, in main.ts.)
    try {
      const theme = localStorage.getItem('rackhopper.theme')
      if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme
    } catch { }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" />
</head>

<body>
  <header class="topbar">
    <!-- TODO: put your GitHub profile or repository URL in href. -->
    <a class="logo-link" href="https://github.com/mxncmrchnd/rackhopper/" target="_blank" rel="noopener noreferrer"
      aria-label="rackhopper on GitHub (opens in a new tab)" data-i18n-label="topbar.github">
      <img class="logo" src="/logo.png" alt="" width="36" height="36" />
    </a>
    <h1>rackhopper</h1>
    <nav class="project-actions" aria-label="Project" data-i18n-label="project.label">
      <button id="new-project" class="topbar-button" type="button" data-i18n="project.new">
        New
      </button>
      <button id="open-project" class="topbar-button" type="button" data-i18n="project.open">
        Open…
      </button>
      <button id="save-project" class="topbar-button" type="button" data-i18n="project.save">
        Save
      </button>
      <button id="share-project" class="topbar-button" type="button" data-i18n="project.share">
        Share link
      </button>
      <button id="import-midi" class="topbar-button" type="button" data-i18n="project.importMidi">
        Import MIDI…
      </button>
      <button id="export-audio" class="topbar-button" type="button" data-i18n="project.exportWav">
        Export WAV
      </button>
      <input id="project-file" type="file" accept=".json,application/json" hidden />
      <input id="midi-file" type="file" accept=".mid,.midi,audio/midi" hidden />
    </nav>
    <span id="status" class="status" role="status" aria-live="polite"></span>
    <!-- Segmented toggles (controls, theme, language) are added here by main.ts. -->
    <div id="toggles" class="toggles"></div>
  </header>

  <main class="workspace">
    <section class="panel sequencer" aria-label="Sequencer" data-i18n-label="sequencer.label">
      <div class="transport">
        <button id="play" type="button" aria-pressed="false">Play</button>
        <button id="clear" type="button" data-i18n="transport.clear">Clear</button>
        <button id="quantize" type="button" data-i18n="transport.quantize">Quantize</button>
        <label class="field">
          <span data-i18n="transport.bars">Bars</span>
          <input id="bars" type="number" min="1" max="64" step="1" value="4" />
        </label>
        <label class="field">
          <span data-i18n="transport.voices">Voices</span>
          <select id="voices">
            <option value="1" data-i18n="transport.mono">1 (mono)</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="6">6</option>
            <option value="8">8</option>
          </select>
        </label>
        <div class="zoom">
          <button id="zoom-out" type="button" aria-label="Zoom out" data-i18n-label="pianoRoll.zoomOut">−</button>
          <button id="zoom-in" type="button" aria-label="Zoom in" data-i18n-label="pianoRoll.zoomIn">+</button>
        </div>
      </div>
      <p class="hint" data-i18n="pianoRoll.hint"></p>
      <div class="piano-roll-scroll">
        <canvas id="piano-roll"></canvas>
      </div>
    </section>

    <section class="panel rack-panel" aria-label="Rack" data-i18n-label="rack.label">
      <div class="rack-toolbar">
        <select id="add-module" aria-label="Add module" data-i18n-label="rack.addLabel">
          <option value="" data-i18n="rack.add">+ Add module…</option>
        </select>
        <p class="hint" data-i18n="rack.hint"></p>
      </div>
      <div class="rack-scroll">
        <div id="rack" class="rack"></div>
      </div>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
