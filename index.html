<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rackhopper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    />
  </head>
  <body>
    <main id="app">
      <h1>rackhopper</h1>

      <section class="module" aria-labelledby="adsr-title">
        <h2 id="adsr-title">ADSR</h2>
        <label class="slider">
          <span>Attack</span>
          <input id="attack" type="range" min="0.001" max="2" step="0.001" />
          <output id="attack-value"></output>
        </label>
        <label class="slider">
          <span>Decay</span>
          <input id="decay" type="range" min="0.001" max="2" step="0.001" />
          <output id="decay-value"></output>
        </label>
        <label class="slider">
          <span>Sustain</span>
          <input id="sustain" type="range" min="0" max="1" step="0.01" />
          <output id="sustain-value"></output>
        </label>
        <label class="slider">
          <span>Release</span>
          <input id="release" type="range" min="0.001" max="3" step="0.001" />
          <output id="release-value"></output>
        </label>
      </section>

      <button id="gate" type="button" aria-pressed="false">Hold to play</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
